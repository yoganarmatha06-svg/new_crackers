<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%">
  <defs>
    <!-- Soft Sticker Drop Shadow -->
    <filter id="stickerShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#021c3d" flood-opacity="0.35"/>
    </filter>

    <!-- Flame Royal Purple Gradients -->
    <linearGradient id="flameGradPurple" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="45%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Flame Yellow/Amber Inner Gradients -->
    <linearGradient id="flameGradYellow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- Golden Medallion Gradient -->
    <radialGradient id="goldMedallion" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="90%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>

    <!-- Blue Script Gradient for "New" -->
    <linearGradient id="blueScriptGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Ribbon Royal Purple Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="35%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    
    <!-- Ribbon Tail Dark Fold -->
    <linearGradient id="ribbonDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e0538"/>
    </linearGradient>
  </defs>

  <!-- ================= STICKER WHITE BASE (OUTLINE) ================= -->
  <g filter="url(#stickerShadow)">
    <!-- Solid White Sticker Cutout Background Silhouette -->
    <!-- Composite path covering flames, medallion, and ribbon tails -->
    <path d="
      M 250,18
      C 275,70 310,65 330,70
      C 345,45 375,65 390,95
      C 405,125 395,160 415,185
      C 435,210 425,245 440,285
      C 445,300 475,295 485,325
      C 490,340 470,365 480,395
      C 475,405 450,400 425,410
      C 410,430 380,470 340,490
      C 295,510 205,510 160,490
      C 120,470 90,430 75,410
      C 50,400 25,405 20,395
      C 30,365 10,340 15,325
      C 25,295 55,300 60,285
      C 75,245 65,210 85,185
      C 105,160 95,125 110,95
      C 125,65 155,45 170,70
      C 190,65 225,70 250,18 Z
    " fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- ================= FLAMES BACKGROUND ================= -->
  <!-- Outer Purple Fiery Crown -->
  <path d="
    M 250,28
    C 270,78 300,72 320,78
    C 335,55 365,75 378,105
    C 390,135 380,165 400,190
    C 418,212 410,245 422,282
    C 410,320 395,360 370,390
    C 330,440 290,465 250,470
    C 210,465 170,440 130,390
    C 105,360 90,320 78,282
    C 90,245 82,212 100,190
    C 120,165 110,135 122,105
    C 135,75 165,55 180,78
    C 200,72 230,78 250,28 Z
  " fill="url(#flameGradPurple)"/>

  <!-- Inner Yellow/Amber Flame Highlights -->
  <path d="
    M 250,55
    C 265,100 288,96 305,102
    C 318,84 342,100 352,125
    C 362,150 352,175 370,196
    C 385,215 378,245 388,276
    C 378,320 355,365 330,395
    C 295,435 270,448 250,450
    C 230,448 205,435 170,395
    C 145,365 122,320 112,276
    C 122,245 115,215 130,196
    C 148,175 138,150 148,125
    C 158,100 182,84 195,102
    C 212,96 235,100 250,55 Z
  " fill="url(#flameGradYellow)"/>

  <!-- Yellow Inner Tongues -->
  <path d="
    M 250,82
    C 260,118 280,115 292,122
    C 302,110 320,122 328,142
    C 335,162 330,180 342,198
    C 325,230 315,250 250,250
    C 185,250 175,230 158,198
    C 170,180 165,162 172,142
    C 180,122 198,110 208,122
    C 220,115 240,118 250,82 Z
  " fill="#fef08a" opacity="0.85"/>

  <!-- ================= GOLDEN MEDALLION ================= -->
  <!-- Main Golden Circle -->
  <circle cx="250" cy="275" r="145" fill="url(#goldMedallion)" stroke="#b45309" stroke-width="3"/>
  <circle cx="250" cy="275" r="139" fill="none" stroke="#fef08a" stroke-width="2.5" opacity="0.9"/>
  <!-- Dotted decorative inner ring -->
  <circle cx="250" cy="275" r="132" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- "SINCE 1994" Curved Heritage Text in Royal Purple -->
  <path id="heritageArc" d="M 145,238 A 120 120 0 0 1 355,238" fill="none"/>
  <text>
    <textPath href="#heritageArc" startOffset="50%" text-anchor="middle"
      font-family="'Impact', 'Arial Black', -apple-system, sans-serif"
      font-size="20"
      font-weight="900"
      letter-spacing="5"
      fill="#4c1d95">
      SINCE 1994
    </textPath>
  </text>

  <!-- ================= BRAND TEXT: "New" (Retro Blue Script) ================= -->
  <g transform="translate(250, 260)" filter="url(#textShadow)">
    <!-- White Bold Outer Stroke for Sticker Effect -->
    <text x="0" y="0" text-anchor="middle"
      font-family="'Pacifico', 'Brush Script MT', 'Dancing Script', 'Segoe Script', cursive"
      font-size="108"
      font-weight="900"
      font-style="italic"
      fill="#ffffff"
      stroke="#ffffff"
      stroke-width="18"
      stroke-linejoin="round">
      New
    </text>
    <!-- Dark 3D Drop Underlay -->
    <text x="3" y="5" text-anchor="middle"
      font-family="'Pacifico', 'Brush Script MT', 'Dancing Script', 'Segoe Script', cursive"
      font-size="108"
      font-weight="900"
      font-style="italic"
      fill="#0c4a6e">
      New
    </text>
    <!-- Vibrant Blue Gradient Fill -->
    <text x="0" y="0" text-anchor="middle"
      font-family="'Pacifico', 'Brush Script MT', 'Dancing Script', 'Segoe Script', cursive"
      font-size="108"
      font-weight="900"
      font-style="italic"
      fill="url(#blueScriptGrad)">
      New
    </text>
    <!-- Specular highlight glint on "New" -->
    <text x="-2" y="-2" text-anchor="middle"
      font-family="'Pacifico', 'Brush Script MT', 'Dancing Script', 'Segoe Script', cursive"
      font-size="108"
      font-weight="900"
      font-style="italic"
      fill="none"
      stroke="#bae6fd"
      stroke-width="2.5"
      opacity="0.6">
      New
    </text>
  </g>

  <!-- ================= SWEEPING ROYAL PURPLE RIBBON BANNER ================= -->
  <!-- Left Ribbon Tail Behind -->
  <g>
    <!-- Left notched tail -->
    <path d="
      M 105,335
      L 35,320
      L 58,355
      L 25,392
      L 105,380 Z
    " fill="url(#ribbonDark)"/>
    <path d="
      M 105,335
      L 45,324
      L 65,355
      L 35,388
      L 105,378 Z
    " fill="url(#flameGradPurple)"/>
    <!-- Shadow fold triangle -->
    <polygon points="105,335 105,380 130,358" fill="#1e0538"/>
  </g>

  <!-- Right Ribbon Tail Behind -->
  <g>
    <!-- Right notched tail -->
    <path d="
      M 395,335
      L 465,320
      L 442,355
      L 475,392
      L 395,380 Z
    " fill="url(#ribbonDark)"/>
    <path d="
      M 395,335
      L 455,324
      L 435,355
      L 465,388
      L 395,378 Z
    " fill="url(#flameGradPurple)"/>
    <!-- Shadow fold triangle -->
    <polygon points="395,335 395,380 370,358" fill="#1e0538"/>
  </g>

  <!-- Main Front Curved Ribbon Banner in Royal Purple -->
  <!-- Outer ribbon shape -->
  <path d="
    M 90,342
    C 170,312 330,312 410,342
    L 415,410
    C 330,380 170,380 85,410 Z
  " fill="url(#ribbonGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>

  <!-- Top gold highlight line on ribbon -->
  <path d="
    M 94,346
    C 172,318 328,318 406,346
  " fill="none" stroke="#fde047" stroke-width="2.5" opacity="0.8"/>

  <!-- Bottom dark purple shadow line on ribbon -->
  <path d="
    M 89,404
    C 172,374 328,374 411,404
  " fill="none" stroke="#3b0764" stroke-width="2.5" opacity="0.7"/>

  <!-- ================= TEXT ON RIBBON: "crackers" ================= -->
  <!-- Arched Path following Ribbon Curve -->
  <path id="ribbonTextArc" d="M 105,386 C 180,358 320,358 395,386" fill="none"/>
  
  <!-- "crackers" Script in Pure White -->
  <text filter="url(#textShadow)">
    <textPath href="#ribbonTextArc" startOffset="50%" text-anchor="middle"
      font-family="'Pacifico', 'Brush Script MT', 'Dancing Script', 'Segoe Script', cursive"
      font-size="44"
      font-weight="bold"
      letter-spacing="1"
      fill="#ffffff">
      crackers
    </textPath>
  </text>

  <!-- Bottom Gold Medallion Rim (Peeking Under Ribbon) -->
  <path d="
    M 175,445
    C 200,454 225,458 250,458
    C 275,458 300,454 325,445
    C 300,470 275,475 250,475
    C 225,475 200,470 175,445 Z
  " fill="url(#goldMedallion)" stroke="#b45309" stroke-width="1.5"/>

  <!-- Decorative Sparkles / Stars -->
  <g fill="#fde047" opacity="0.9">
    <!-- Left Star -->
    <polygon points="120,285 123,293 131,295 125,301 127,309 120,305 113,309 115,301 109,295 117,293"/>
    <!-- Right Star -->
    <polygon points="380,285 383,293 391,295 385,301 387,309 380,305 373,309 375,301 369,295 377,293"/>
  </g>
</svg>
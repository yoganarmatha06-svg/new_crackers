<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240046" />
      <stop offset="60%" stop-color="#3c096c" />
      <stop offset="100%" stop-color="#0a0319" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f72585" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle festive geometric pattern -->
  <g opacity="0.06" stroke="#fff" stroke-width="1.5" fill="none">
    <circle cx="300.0" cy="225.0" r="120"/>
    <circle cx="300.0" cy="225.0" r="180"/>
    <circle cx="300.0" cy="225.0" r="240"/>
  </g>
  
  <!-- Graphic Art -->
  
            <defs>
                <filter id="fpglow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="5" result="blur"/>
                    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                </filter>
            </defs>
            <g transform="translate(300.0, 337.5)">
                <!-- Eruption of sparkles -->
                <path d="M0,-30 Q-108,-120 -168,-220" fill="none" stroke="#ffec80" stroke-width="3" filter="url(#fpglow)"/><path d="M0,-30 Q-72,-120 -112,-220" fill="none" stroke="#ffa500" stroke-width="3" filter="url(#fpglow)"/><path d="M0,-30 Q-36,-120 -56,-220" fill="none" stroke="#ffffff" stroke-width="3" filter="url(#fpglow)"/><path d="M0,-30 Q0,-120 0,-220" fill="none" stroke="#ffe066" stroke-width="3" filter="url(#fpglow)"/><path d="M0,-30 Q36,-120 56,-220" fill="none" stroke="#ffffff" stroke-width="3" filter="url(#fpglow)"/><path d="M0,-30 Q72,-120 112,-220" fill="none" stroke="#ffa500" stroke-width="3" filter="url(#fpglow)"/><path d="M0,-30 Q108,-120 168,-220" fill="none" stroke="#ffec80" stroke-width="3" filter="url(#fpglow)"/><path d="M0,-30 Q-54,-120 -84,-220" fill="none" stroke="#ff4500" stroke-width="3" filter="url(#fpglow)"/><path d="M0,-30 Q54,-120 84,-220" fill="none" stroke="#ff4500" stroke-width="3" filter="url(#fpglow)"/>
                <circle cx="-163" cy="-160" r="4" fill="#ffffff" filter="url(#fpglow)"/><circle cx="-135" cy="-170" r="4" fill="#ffffff" filter="url(#fpglow)"/><circle cx="-107" cy="-180" r="4" fill="#ffffff" filter="url(#fpglow)"/><circle cx="-79" cy="-190" r="4" fill="#ffffff" filter="url(#fpglow)"/><circle cx="-51" cy="-200" r="4" fill="#ffffff" filter="url(#fpglow)"/><circle cx="-23" cy="-210" r="4" fill="#ffffff" filter="url(#fpglow)"/><circle cx="5" cy="-220" r="4" fill="#ffffff" filter="url(#fpglow)"/><circle cx="33" cy="-210" r="4" fill="#ffffff" filter="url(#fpglow)"/><circle cx="61" cy="-200" r="4" fill="#ffffff" filter="url(#fpglow)"/><circle cx="89" cy="-190" r="4" fill="#ffffff" filter="url(#fpglow)"/><circle cx="117" cy="-180" r="4" fill="#ffffff" filter="url(#fpglow)"/><circle cx="145" cy="-170" r="4" fill="#ffffff" filter="url(#fpglow)"/><circle cx="173" cy="-160" r="4" fill="#ffffff" filter="url(#fpglow)"/>
                <!-- Pot base -->
                <path d="M-50,60 L-30,-30 L30,-30 L50,60 Z" fill="#c2410c" stroke="#f59e0b" stroke-width="4"/>
                <rect x="-35" y="-10" width="70" height="25" rx="4" fill="#78350f" />
                <text x="0" y="8" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fef08a" text-anchor="middle">ANAR</text>
                <ellipse cx="0" cy="-30" rx="30" ry="10" fill="#f59e0b"/>
                <ellipse cx="0" cy="-30" rx="20" ry="6" fill="#fff" filter="url(#fpglow)"/>
            </g>
        
  
  <!-- Labels and Typography -->
  
  <g transform="translate(300.0, 405)">
    <rect x="-180" y="-30" width="360" height="42" rx="21" fill="#000000" opacity="0.45"/>
    <text x="0" y="-8" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FLOWER POTS</text>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffd166" text-anchor="middle">Sparkling Colorful Anars</text>
  </g>
  
</svg>
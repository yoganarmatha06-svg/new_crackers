<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0718" />
      <stop offset="60%" stop-color="#881337" />
      <stop offset="100%" stop-color="#0a0319" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle festive geometric pattern -->
  <g opacity="0.06" stroke="#fff" stroke-width="1.5" fill="none">
    <circle cx="300.0" cy="250.0" r="120"/>
    <circle cx="300.0" cy="250.0" r="180"/>
    <circle cx="300.0" cy="250.0" r="240"/>
  </g>
  
  <!-- Graphic Art -->
  
            <g transform="translate(300.0, 250.0)">
                <!-- Box base -->
                <rect x="-80" y="-30" width="160" height="110" rx="8" fill="#b91c1c" stroke="#f59e0b" stroke-width="4"/>
                <!-- Box lid -->
                <rect x="-90" y="-55" width="180" height="30" rx="5" fill="#dc2626" stroke="#f59e0b" stroke-width="3"/>
                <!-- Golden Ribbon Vertical -->
                <rect x="-18" y="-55" width="36" height="135" fill="#facc15"/>
                <!-- Golden Ribbon Horizontal -->
                <rect x="-80" y="10" width="160" height="25" fill="#facc15"/>
                <!-- Bow -->
                <ellipse cx="-20" cy="-65" rx="22" ry="14" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
                <ellipse cx="20" cy="-65" rx="22" ry="14" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
                <circle cx="0" cy="-60" r="10" fill="#f59e0b"/>
                <text x="0" y="65" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">ROYAL MEGA BOX</text>
            </g>
        
  
  <!-- Labels and Typography -->
  
  <g transform="translate(300.0, 455)">
    <rect x="-180" y="-30" width="360" height="42" rx="21" fill="#000000" opacity="0.45"/>
    <text x="0" y="-8" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Mega Anandam Family Box (50 Items)</text>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fde047" text-anchor="middle">Gift Boxes</text>
  </g>
  
</svg>
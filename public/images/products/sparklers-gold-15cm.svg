<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10002b" />
      <stop offset="60%" stop-color="#240046" />
      <stop offset="100%" stop-color="#0a0319" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f72585" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle festive geometric pattern -->
  <g opacity="0.06" stroke="#fff" stroke-width="1.5" fill="none">
    <circle cx="300.0" cy="250.0" r="120"/>
    <circle cx="300.0" cy="250.0" r="180"/>
    <circle cx="300.0" cy="250.0" r="240"/>
  </g>
  
  <!-- Graphic Art -->
  
            <defs>
                <filter id="spglow"><feGaussianBlur stdDeviation="4" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
            </defs>
            <g transform="translate(300.0, 250.0) rotate(-25)">
                <!-- Sparkler rod -->
                <line x1="0" y1="120" x2="0" y2="40" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
                <!-- Chemical coating -->
                <line x1="0" y1="40" x2="0" y2="-90" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
                <!-- Burning head -->
                <circle cx="0" cy="-90" r="12" fill="#fff" filter="url(#spglow)"/>
                <!-- Golden sparks branching -->
                <line x1="0" y1="-90" x2="80.0" y2="-90.0" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#spglow)"/><line x1="0" y1="-90" x2="75.2" y2="-62.6" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#spglow)"/><line x1="0" y1="-90" x2="61.3" y2="-38.6" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#spglow)"/><line x1="0" y1="-90" x2="40.0" y2="-20.7" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#spglow)"/><line x1="0" y1="-90" x2="13.9" y2="-11.2" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#spglow)"/><line x1="0" y1="-90" x2="-13.9" y2="-11.2" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#spglow)"/><line x1="0" y1="-90" x2="-40.0" y2="-20.7" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#spglow)"/><line x1="0" y1="-90" x2="-61.3" y2="-38.6" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#spglow)"/><line x1="0" y1="-90" x2="-75.2" y2="-62.6" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#spglow)"/><line x1="0" y1="-90" x2="-80.0" y2="-90.0" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#spglow)"/><line x1="0" y1="-90" x2="-75.2" y2="-117.4" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#spglow)"/><line x1="0" y1="-90" x2="-61.3" y2="-141.4" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#spglow)"/><line x1="0" y1="-90" x2="-40.0" y2="-159.3" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#spglow)"/><line x1="0" y1="-90" x2="-13.9" y2="-168.8" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#spglow)"/><line x1="0" y1="-90" x2="13.9" y2="-168.8" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#spglow)"/><line x1="0" y1="-90" x2="40.0" y2="-159.3" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#spglow)"/><line x1="0" y1="-90" x2="61.3" y2="-141.4" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#spglow)"/><line x1="0" y1="-90" x2="75.2" y2="-117.4" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#spglow)"/>
                <circle cx="60.0" cy="-90.0" r="3" fill="#ffffff"/><circle cx="52.0" cy="-60.0" r="3" fill="#ffffff"/><circle cx="30.0" cy="-38.0" r="3" fill="#ffffff"/><circle cx="0.0" cy="-30.0" r="3" fill="#ffffff"/><circle cx="-30.0" cy="-38.0" r="3" fill="#ffffff"/><circle cx="-52.0" cy="-60.0" r="3" fill="#ffffff"/><circle cx="-60.0" cy="-90.0" r="3" fill="#ffffff"/><circle cx="-52.0" cy="-120.0" r="3" fill="#ffffff"/><circle cx="-30.0" cy="-142.0" r="3" fill="#ffffff"/><circle cx="-0.0" cy="-150.0" r="3" fill="#ffffff"/><circle cx="30.0" cy="-142.0" r="3" fill="#ffffff"/><circle cx="52.0" cy="-120.0" r="3" fill="#ffffff"/>
            </g>
        
  
  <!-- Labels and Typography -->
  
  <g transform="translate(300.0, 455)">
    <rect x="-180" y="-30" width="360" height="42" rx="21" fill="#000000" opacity="0.45"/>
    <text x="0" y="-8" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">15 cm Electric Sparklers</text>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffd166" text-anchor="middle">Sparklers</text>
  </g>
  
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120724" />
      <stop offset="60%" stop-color="#280d47" />
      <stop offset="100%" stop-color="#0a0319" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="120" fill="url(#bgGrad)"/>
  
  <!-- Subtle festive geometric pattern -->
  <g opacity="0.06" stroke="#fff" stroke-width="1.5" fill="none">
    <circle cx="60.0" cy="60.0" r="120"/>
    <circle cx="60.0" cy="60.0" r="180"/>
    <circle cx="60.0" cy="60.0" r="240"/>
  </g>
  
  <!-- Graphic Art -->
  
            <defs>
                <linearGradient id="logoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#facc15"/>
                    <stop offset="50%" stop-color="#ff6b00"/>
                    <stop offset="100%" stop-color="#dc2626"/>
                </linearGradient>
            </defs>
            <g transform="translate(60, 60)">
                <circle cx="0" cy="0" r="48" fill="url(#logoGlow)"/>
                <circle cx="0" cy="0" r="42" fill="#120724"/>
                <!-- Flame / Diya / Cracker -->
                <ellipse cx="0" cy="14" rx="26" ry="10" fill="#f97316"/>
                <path d="M0,8 Q-10,-12 0,-30 Q10,-12 0,8 Z" fill="#facc15"/>
                <circle cx="0" cy="-10" r="5" fill="#ffffff"/>
                <!-- Spark points -->
                <circle cx="34.0" cy="0.0" r="2.5" fill="#fde047"/><circle cx="24.1" cy="24.0" r="2.5" fill="#fde047"/><circle cx="0.0" cy="34.0" r="2.5" fill="#fde047"/><circle cx="-24.0" cy="24.1" r="2.5" fill="#fde047"/><circle cx="-34.0" cy="0.1" r="2.5" fill="#fde047"/><circle cx="-24.1" cy="-24.0" r="2.5" fill="#fde047"/><circle cx="-0.1" cy="-34.0" r="2.5" fill="#fde047"/><circle cx="24.0" cy="-24.1" r="2.5" fill="#fde047"/>
            </g>
        
  
  <!-- Labels and Typography -->
  
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13082b" />
      <stop offset="60%" stop-color="#31105e" />
      <stop offset="100%" stop-color="#0a0319" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle festive geometric pattern -->
  <g opacity="0.06" stroke="#fff" stroke-width="1.5" fill="none">
    <circle cx="300.0" cy="200.0" r="120"/>
    <circle cx="300.0" cy="200.0" r="180"/>
    <circle cx="300.0" cy="200.0" r="240"/>
  </g>
  
  <!-- Graphic Art -->
  
            <g transform="translate(300.0, 200.0)">
                <rect x="-120" y="-80" width="240" height="160" rx="12" fill="#1e1b4b" stroke="#f59e0b" stroke-width="4"/>
                <circle cx="0" cy="-20" r="38" fill="#b91c1c" stroke="#facc15" stroke-width="3"/>
                <text x="0" y="-12" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#fff" text-anchor="middle">30+</text>
                <text x="0" y="10" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fde047" text-anchor="middle">YEARS OF TRUST</text>
                <text x="0" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">SIVAKASI DIRECT</text>
                <text x="0" y="65" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Authentic Factory Manufacturing</text>
            </g>
        
  
  <!-- Labels and Typography -->
  
  <g transform="translate(300.0, 355)">
    <rect x="-180" y="-30" width="360" height="42" rx="21" fill="#000000" opacity="0.45"/>
    <text x="0" y="-8" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">TRADITION OF QUALITY</text>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">Trusted Sivakasi Cracker Manufacturer</text>
  </g>
  
</svg>